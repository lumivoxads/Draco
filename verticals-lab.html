<!doctype html>
<html class="cunnet-dark no-js" lang="en">
<head>
   <meta charset="utf-8">
   <title>Draco — Verticals & Geographies Design Lab</title>
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <meta name="robots" content="noindex,nofollow">
   <link rel="stylesheet" href="template/assets/css/font-awesome-pro.css">
   <link rel="stylesheet" href="template/assets/css/main.css">
   <link rel="stylesheet" href="assets/site.css">
   <style>
      /* Base Lab Styles */
      html { scroll-behavior: smooth; }
      body { margin: 0; overflow-x: hidden; background: #000; }
      
      /* Shared Canvas Environment */
      .canvas-container { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
      canvas#earth { position: absolute; inset: 0; display: block; }
      .grade { position: absolute; inset: 0; z-index: 1; background: radial-gradient(70% 60% at 80% 20%, rgba(201,169,106,.10), transparent 60%); }
      .scrim { position: absolute; inset: 0; z-index: 2; background: linear-gradient(270deg, rgba(3,4,6,.82) 0%, rgba(3,4,6,.45) 34%, transparent 62%); }
      
      /* Treatment Panel Base */
      .panel { position: relative; z-index: 10; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 120px var(--d-pad) 80px; }
      .panel .wrap { width: 100%; max-width: 1320px; margin: 0 auto; }
      
      .panel-tag { position: absolute; top: var(--d-pad); left: var(--d-pad); background: rgba(255,255,255,0.1); backdrop-filter: blur(4px); padding: 6px 12px; border-radius: 4px; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--d-fg); border: 1px solid rgba(255,255,255,0.2); }
      .panel-note { max-width: 600px; margin-top: 60px; font-size: 14px; color: var(--d-muted); line-height: 1.6; padding: 16px; border-left: 2px solid var(--d-line); background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); }
      
      /* Fixed Nav Index */
      .lab-nav { position: fixed; right: var(--d-pad); top: 50%; transform: translateY(-50%); z-index: 100; display: flex; flex-direction: column; gap: 12px; }
      .lab-nav a { width: 12px; height: 12px; border-radius: 50%; background: var(--d-dim); border: 2px solid transparent; transition: 0.3s; display: block; }
      .lab-nav a:hover, .lab-nav a.active { background: transparent; border-color: var(--d-accent); transform: scale(1.2); }
      
      /* =========================================
         Option A — Glass Bento Grid
         ========================================= */
      .opt-a .bento-grid { display: grid; gap: 20px; grid-template-columns: repeat(4, 1fr); margin-top: 40px; }
      .opt-a .bento-card { background: rgba(12, 15, 20, 0.4); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--d-line-2); border-radius: 16px; padding: 32px; opacity: 0; transform: translateY(30px); transition: opacity 0.6s ease-out, transform 0.6s ease-out; }
      .opt-a.is-inview .bento-card { opacity: 1; transform: translateY(0); }
      .opt-a .bento-card:nth-child(1) { transition-delay: 0ms; }
      .opt-a .bento-card:nth-child(2) { transition-delay: 80ms; }
      .opt-a .bento-card:nth-child(3) { transition-delay: 160ms; }
      .opt-a .bento-card:nth-child(4) { transition-delay: 240ms; }
      
      .opt-a .bento-card.feat { grid-column: span 2; grid-row: span 2; }
      .opt-a .bento-card h3 { font-family: var(--d-ff-disp); font-size: 1.8rem; text-transform: uppercase; margin: 0 0 16px; color: var(--d-fg); border-bottom: 1px solid var(--d-accent); padding-bottom: 12px; }
      .opt-a .bento-card.feat h3 { font-size: 2.8rem; }
      .opt-a .bento-chips { display: flex; flex-wrap: wrap; gap: 8px; }
      .opt-a .bento-chip { font-size: 13px; color: var(--d-fg); padding: 6px 14px; border: 1px solid var(--d-accent-dim); border-radius: 100px; background: rgba(201,169,106,0.05); }
      
      /* =========================================
         Option B — Orbital Coverage Map
         ========================================= */
      .opt-b { position: relative; }
      .opt-b .orbital-map { position: relative; width: 100%; height: 600px; margin-top: 40px; }
      .opt-b .node { position: absolute; display: flex; align-items: center; gap: 16px; opacity: 0; transition: opacity 0.8s ease-out; }
      .opt-b.is-inview .node { opacity: 1; }
      .opt-b .node-point { width: 8px; height: 8px; background: var(--d-accent); border-radius: 50%; position: relative; box-shadow: 0 0 10px var(--d-accent); z-index: 2; }
      .opt-b .node-point::after { content: ''; position: absolute; inset: -12px; border: 1px solid var(--d-accent); border-radius: 50%; opacity: 0; pointer-events: none; }
      .opt-b.is-inview .node-point::after { animation: node-pulse 3s infinite ease-out; }
      @keyframes node-pulse { 0% { transform: scale(0.5); opacity: 0.8; } 100% { transform: scale(2); opacity: 0; } }
      
      .opt-b .node-line { height: 1px; background: var(--d-accent); width: 0; transition: width 1s ease-in-out 0.4s; }
      .opt-b.is-inview .node-line { width: 80px; }
      
      .opt-b .node-content { display: flex; flex-direction: column; opacity: 0; transform: translateX(-10px); transition: all 0.6s ease-out 1.2s; }
      .opt-b.is-inview .node-content { opacity: 1; transform: translateX(0); }
      .opt-b .node-content h3 { font-family: var(--d-ff-disp); font-size: 1.4rem; text-transform: uppercase; margin: 0 0 4px; color: var(--d-fg); }
      .opt-b .node-content p { font-size: 13px; color: var(--d-muted); margin: 0; max-width: 280px; line-height: 1.4; }
      
      /* Positioning (avoiding center Earth) */
      .opt-b .node:nth-child(1) { top: 10%; left: 45%; }
      .opt-b .node:nth-child(2) { top: 35%; left: 55%; }
      .opt-b .node:nth-child(3) { top: 60%; left: 60%; }
      .opt-b .node:nth-child(4) { top: 85%; left: 50%; }

      /* =========================================
         Option C — Kinetic Marquee Bands
         ========================================= */
      .opt-c .marquee-container { margin-top: 60px; display: flex; flex-direction: column; gap: 0; border-top: 1px solid var(--d-accent-dim); overflow: hidden; }
      .opt-c .marquee-row { display: flex; align-items: center; border-bottom: 1px solid var(--d-accent-dim); padding: 24px 0; overflow: hidden; position: relative; }
      .opt-c .marquee-label { width: 250px; flex-shrink: 0; font-family: var(--d-ff-disp); font-size: 2rem; color: var(--d-fg); text-transform: uppercase; position: relative; z-index: 2; padding-right: 40px; background: linear-gradient(90deg, rgba(6,7,10,0.95) 70%, transparent); }
      .opt-c .marquee-track { display: flex; gap: 40px; white-space: nowrap; will-change: transform; transform: translateX(0); }
      .opt-c.is-inview .marquee-track.fwd { animation: marquee-scroll 40s linear infinite; }
      .opt-c.is-inview .marquee-track.rev { animation: marquee-scroll-rev 45s linear infinite; }
      .opt-c .marquee-row:hover .marquee-track { animation-play-state: paused !important; }
      
      .opt-c .marquee-item { font-size: 1.2rem; color: var(--d-muted); display: inline-flex; align-items: center; gap: 40px; }
      .opt-c .marquee-item::after { content: '✦'; color: var(--d-accent); font-size: 0.8rem; }
      
      @keyframes marquee-scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
      @keyframes marquee-scroll-rev { 0% { transform: translateX(-50%); } 100% { transform: translateX(0); } }

      /* =========================================
         Option D — Coverage Matrix
         ========================================= */
      .opt-d .matrix-table { width: 100%; border-collapse: collapse; margin-top: 60px; }
      .opt-d th, .opt-d td { padding: 20px 16px; text-align: center; border-bottom: 1px solid var(--d-line); transition: background 0.2s; }
      .opt-d th:first-child, .opt-d td:first-child { text-align: left; padding-left: 0; }
      .opt-d th:last-child, .opt-d td:last-child { padding-right: 0; }
      .opt-d th { font-family: var(--d-ff-disp); text-transform: uppercase; color: var(--d-muted); font-size: 1rem; border-bottom: 2px solid var(--d-line-2); }
      .opt-d td:first-child { font-size: 1.1rem; color: var(--d-fg); }
      
      /* Hover highlights for row/col */
      .opt-d .matrix-table tbody tr:hover td { background: rgba(255,255,255,0.03); }
      .opt-d .matrix-table td:hover::before { content: ""; position: absolute; top: 0; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.02); z-index: -1; pointer-events: none; }
      .opt-d .matrix-table td { position: relative; z-index: 1; }

      .opt-d .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; opacity: 0; transform: scale(0); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
      .opt-d .dot.filled { background: var(--d-accent); }
      .opt-d .dot.hollow { border: 2px solid var(--d-accent); }
      .opt-d.is-inview .dot { opacity: 1; transform: scale(1); }
      
      .opt-d .legend { display: flex; gap: 24px; margin-top: 24px; font-size: 13px; color: var(--d-muted); justify-content: flex-end; }
      .opt-d .legend-item { display: flex; align-items: center; gap: 8px; }
      
      .opt-d .mobile-list { display: none; margin-top: 40px; }
      .opt-d .mobile-item { border-bottom: 1px solid var(--d-line); padding: 24px 0; }
      .opt-d .mobile-item h4 { margin: 0 0 12px; font-size: 1.2rem; color: var(--d-fg); }
      .opt-d .mobile-tags { display: flex; flex-wrap: wrap; gap: 8px; }
      .opt-d .mobile-tag { font-size: 12px; padding: 4px 12px; border-radius: 4px; border: 1px solid var(--d-line-2); color: var(--d-muted); }
      .opt-d .mobile-tag.active { border-color: var(--d-accent); color: var(--d-accent); }
      
      @media (max-width: 991px) {
         .opt-a .bento-grid { grid-template-columns: repeat(2, 1fr); }
         .opt-a .bento-card.feat { grid-column: span 1; grid-row: span 1; }
         .opt-b .node:nth-child(1) { top: 10%; left: 10%; }
         .opt-b .node:nth-child(2) { top: 35%; left: 20%; }
         .opt-b .node:nth-child(3) { top: 60%; left: 30%; }
         .opt-b .node:nth-child(4) { top: 85%; left: 15%; }
         .opt-b .node-line { width: 30px; }
         .opt-c .marquee-label { width: 180px; font-size: 1.4rem; }
      }
      
      @media (max-width: 768px) {
         .opt-a .bento-grid { grid-template-columns: 1fr; }
         .opt-b .node { flex-direction: column; align-items: flex-start; gap: 8px; }
         .opt-b .node-line { display: none; }
         .opt-b .node-content { padding-left: 20px; transform: translateX(0); }
         .opt-c .marquee-row { flex-direction: column; align-items: flex-start; gap: 16px; }
         .opt-c .marquee-label { width: 100%; background: none; padding-right: 0; }
         
         .opt-d .matrix-table { display: none; }
         .opt-d .mobile-list { display: block; }
         .opt-d .legend { justify-content: flex-start; }
      }
      
      @media (prefers-reduced-motion: reduce) {
         .opt-a .bento-card, .opt-b .node, .opt-b .node-content, .opt-d .dot { opacity: 1 !important; transform: none !important; transition: none !important; }
         .opt-b .node-line { width: 80px !important; transition: none !important; }
         .opt-b.is-inview .node-point::after { animation: none !important; opacity: 1; border: 2px solid var(--d-accent); }
         .opt-c .marquee-track { animation: none !important; }
         .opt-c .marquee-container { overflow-x: auto; }
      }
   </style>
</head>
<body>

   <!-- Shared Canvas Background -->
   <div class="canvas-container">
      <canvas id="earth" data-frames="240" data-path="assets/earth-frames/dark/" data-ext="jpg" data-fps="24" aria-hidden="true"></canvas>
      <div class="grade" aria-hidden="true"></div>
      <div class="scrim" aria-hidden="true"></div>
   </div>

   <!-- Navigation Index -->
   <nav class="lab-nav" aria-label="Lab Index">
      <a href="#opt-a" aria-label="Option A" title="Option A"></a>
      <a href="#opt-b" aria-label="Option B" title="Option B"></a>
      <a href="#opt-c" aria-label="Option C" title="Option C"></a>
      <a href="#opt-d" aria-label="Option D" title="Option D"></a>
   </nav>

   <!-- Container for JS rendering -->
   <main id="lab-content"></main>

   <script src="assets/earth-loop.js"></script>
   
   <script>
      // 1. Shared Data Structure (Placeholder)
      // Note: Data is provisional and awaits client confirmation.
      const regionsData = [
         {
            name: "Middle East",
            verticals: ["Retail", "Hospitality", "Fuel & Energy", "Banking & Financial Services"],
            featured: true
         },
         {
            name: "Europe",
            verticals: ["Automotive", "Telecommunications", "E-Commerce"]
         },
         {
            name: "Asia Pacific",
            verticals: ["Restaurants & Cafés", "Healthcare", "Lifestyle"]
         },
         {
            name: "Americas",
            verticals: ["Entertainment", "Enterprise Organisations"]
         }
      ];

      // Extract unique verticals for matrix
      const allVerticalsSet = new Set();
      regionsData.forEach(r => r.verticals.forEach(v => allVerticalsSet.add(v)));
      const allVerticals = Array.from(allVerticalsSet).sort();

      const main = document.getElementById('lab-content');

      // 2. Render Option A (Glass Bento)
      const renderA = () => {
         let cardsHtml = regionsData.map(r => `
            <div class="bento-card ${r.featured ? 'feat' : ''}">
               <h3>${r.name}</h3>
               <div class="bento-chips">
                  ${r.verticals.map(v => `<span class="bento-chip">${v}</span>`).join('')}
               </div>
            </div>
         `).join('');
         
         return `
         <section class="panel opt-a" id="opt-a">
            <div class="panel-tag">Option A &mdash; Glass Bento</div>
            <div class="wrap">
               <div class="section-head">
                  <span class="d-eyebrow">Where we operate</span>
                  <h2 class="d-display" style="text-transform:none;">Verticals & geographies</h2>
               </div>
               <div class="bento-grid">${cardsHtml}</div>
               <!-- Placeholder note -->
               <div class="panel-note">
                  <strong>Notes:</strong> Very robust for varying amounts of data. Scales beautifully to mobile by collapsing the grid into a single column. "Middle East" is set as a featured card spanning two columns. Safest option structurally.
               </div>
            </div>
         </section>`;
      };

      // 3. Render Option B (Orbital Map)
      const renderB = () => {
         let nodesHtml = regionsData.map((r, i) => `
            <div class="node">
               <div class="node-point"></div>
               <div class="node-line"></div>
               <div class="node-content">
                  <h3>${r.name}</h3>
                  <p>${r.verticals.join(' &middot; ')}</p>
               </div>
            </div>
         `).join('');

         return `
         <section class="panel opt-b" id="opt-b">
            <div class="panel-tag">Option B &mdash; Orbital Map</div>
            <div class="wrap">
               <div class="section-head">
                  <span class="d-eyebrow">Where we operate</span>
                  <h2 class="d-display" style="text-transform:none;">Verticals & geographies</h2>
               </div>
               <div class="orbital-map">${nodesHtml}</div>
               <!-- Placeholder note -->
               <div class="panel-note">
                  <strong>Notes:</strong> High risk if client sends 15+ regions, as absolute positioning around the globe will become crowded and overlap the bright areas. Looks highly striking but degrades if content scales unexpectedly. Mobile stack works but loses the globe-orbit effect.
               </div>
            </div>
         </section>`;
      };

      // 4. Render Option C (Kinetic Marquee)
      const renderC = () => {
         let rowsHtml = regionsData.map((r, i) => {
            const items = r.verticals.map(v => `<span class="marquee-item">${v}</span>`).join('');
            const dupItems = items + items + items; // Duplicate for seamless wrap
            const dir = i % 2 === 0 ? 'fwd' : 'rev';
            return `
               <div class="marquee-row">
                  <div class="marquee-label">${r.name}</div>
                  <div class="marquee-track ${dir}">
                     ${dupItems}
                  </div>
               </div>
            `;
         }).join('');

         return `
         <section class="panel opt-c" id="opt-c">
            <div class="panel-tag">Option C &mdash; Kinetic Marquee</div>
            <div class="wrap">
               <div class="section-head">
                  <span class="d-eyebrow">Where we operate</span>
                  <h2 class="d-display" style="text-transform:none;">Verticals & geographies</h2>
               </div>
               <div class="marquee-container">${rowsHtml}</div>
               <!-- Placeholder note -->
               <div class="panel-note">
                  <strong>Notes:</strong> Smooth and continuous motion fits well with the Earth animation. Easily handles any number of items. Pauses on hover. Might feel more like a brand film than a consulting deck depending on the audience.
               </div>
            </div>
         </section>`;
      };

      // 5. Render Option D (Coverage Matrix)
      const renderD = () => {
         let ths = regionsData.map(r => `<th>${r.name}</th>`).join('');
         let trs = allVerticals.map((v, i) => {
            let tds = regionsData.map(r => {
               const hasVertical = r.verticals.includes(v);
               // Randomly make some hollow for the sake of the mockup (emerging vs active)
               const state = hasVertical ? (Math.random() > 0.3 ? 'filled' : 'hollow') : '';
               const dot = state ? `<span class="dot ${state}" style="transition-delay: ${i*50}ms"></span>` : '';
               return `<td>${dot}</td>`;
            }).join('');
            return `<tr><td>${v}</td>${tds}</tr>`;
         }).join('');

         let mobileItems = allVerticals.map(v => {
            let tags = regionsData.map(r => {
               const hasVertical = r.verticals.includes(v);
               return hasVertical ? `<span class="mobile-tag active">${r.name}</span>` : '';
            }).join('');
            return tags ? `<div class="mobile-item"><h4>${v}</h4><div class="mobile-tags">${tags}</div></div>` : '';
         }).join('');

         return `
         <section class="panel opt-d" id="opt-d">
            <div class="panel-tag">Option D &mdash; Coverage Matrix</div>
            <div class="wrap">
               <div class="section-head">
                  <span class="d-eyebrow">Where we operate</span>
                  <h2 class="d-display" style="text-transform:none;">Verticals & geographies</h2>
               </div>
               
               <table class="matrix-table">
                  <thead><tr><th></th>${ths}</tr></thead>
                  <tbody>${trs}</tbody>
               </table>
               <div class="legend">
                  <div class="legend-item"><span class="dot filled" style="opacity:1;transform:scale(1);"></span> Active Presence</div>
                  <div class="legend-item"><span class="dot hollow" style="opacity:1;transform:scale(1);"></span> Emerging</div>
               </div>

               <div class="mobile-list">
                  ${mobileItems}
               </div>

               <!-- Placeholder note -->
               <div class="panel-note">
                  <strong>Notes:</strong> Very information-dense and credible. Hover effects allow scanning easily. Responsive behaviour completely reflows the matrix into a tag-based list on narrow screens, which solves the horizontal scaling problem. Entry animation is a staggered dot appearance.
               </div>
            </div>
         </section>`;
      };

      main.innerHTML = renderA() + renderB() + renderC() + renderD();

      // Intersection Observer for Animations and Nav
      const panels = document.querySelectorAll('.panel');
      const navLinks = document.querySelectorAll('.lab-nav a');

      const observer = new IntersectionObserver((entries) => {
         entries.forEach(entry => {
            const id = entry.target.getAttribute('id');
            const navLink = document.querySelector(`.lab-nav a[href="#${id}"]`);
            
            if (entry.isIntersecting) {
               entry.target.classList.add('is-inview');
               navLinks.forEach(l => l.classList.remove('active'));
               if(navLink) navLink.classList.add('active');
            } else {
               // entry.target.classList.remove('is-inview'); // Optional replay
            }
         });
      }, { threshold: 0.3 });

      panels.forEach(p => observer.observe(p));
   </script>
</body>
</html>
